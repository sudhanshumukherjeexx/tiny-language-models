[project]
name = "tinylm"
version = "0.2.0"
description = "Pretraining, evaluating, and benchmarking a ~27M-parameter Llama-style language model from random initialization."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sudhanshu Mukherjee" }]
requires-python = ">=3.10,<3.14"
keywords = ["language-model", "transformers", "pretraining", "tinystories", "pytorch"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Ranges here state what the code is written against; exact versions for
# reproducible runs live in uv.lock and in each run's environment.json.
dependencies = [
    "torch>=2.6",
    "transformers>=5.13,<6",
    "tokenizers>=0.22",
    "datasets>=4.0",
    "safetensors>=0.5",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "matplotlib>=3.8",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Pick exactly one torch build. See README "Reproduction" for why this is an extra.
cpu = ["torch>=2.6"]
cu126 = ["torch>=2.6"]
cu130 = ["torch>=2.6"]
app = ["gradio>=5.0"]
judge = ["anthropic>=1.0"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.8", "nbformat>=5.10"]
notebook = ["ipykernel>=6.29", "nbclient>=0.10", "nbformat>=5.10"]

[project.urls]
Repository = "https://github.com/sudhanshumukherjeexx/tiny-language-models"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tinylm"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu126" }, { extra = "cu130" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cu126" },
    { index = "pytorch-cu130", extra = "cu130" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py310"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.ipynb" = ["E402", "F401", "B018"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: tests that take more than a few seconds on CPU"]
