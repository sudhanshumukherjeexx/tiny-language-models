name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Ruff lint
        run: uvx ruff@0.16.10 check .
      - name: Ruff format
        run: uvx ruff@0.16.10 format --check .
      - name: Lock file is up to date
        run: uv lock --check
