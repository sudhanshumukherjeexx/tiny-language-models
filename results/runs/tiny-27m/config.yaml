name: tiny-27m
description: Llama-style 27M decoder pretrained from random initialization on TinyStories.
model:
  architecture: llama
  vocab_size: 8192
  hidden_size: 512
  num_hidden_layers: 8
  num_attention_heads: 8
  num_key_value_heads: 2
  intermediate_size: 1408
  max_position_embeddings: 512
  rope_theta: 10000.0
  norm_eps: 1.0e-05
  initializer_range: 0.02
  tie_word_embeddings: true
  attn_implementation: sdpa
  position_encoding: rope
  norm: rmsnorm
  ffn: swiglu
data:
  dataset_name: roneneldan/TinyStories
  dataset_revision: null
  text_field: text
  source_train_split: train
  source_test_split: validation
  validation_fraction: 0.005
  min_chars: 100
  block_size: 512
  packing: true
  decontaminate_test: true
  max_train_examples: null
  subset_seed: 1337
  data_dir: data/tinystories
  normalization:
    unicode_form: NFKC
    ascii_punctuation: true
    strip_non_ascii: false
    collapse_whitespace: true
tokenizer:
  vocab_size: 8192
  min_frequency: 2
  eos_token: <|endoftext|>
  pad_token: <|pad|>
  max_training_examples: null
  path: data/tokenizer-8k
training:
  seed: 1337
  output_dir: runs/tiny-27m
  max_steps: 12000
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 9
  eval_batch_size: 24
  learning_rate: 0.0006
  min_lr_ratio: 0.0
  lr_scheduler: cosine
  warmup_steps: 200
  weight_decay: 0.1
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_eps: 1.0e-08
  gradient_clip_norm: 1.0
  precision: auto
  gradient_checkpointing: false
  log_every: 20
  eval_every: 250
  eval_max_batches: null
  save_every: 250
  keep_last_checkpoints: 2
  deterministic: false
evaluation:
  prompts_path: evaluation/prompts.json
  presets:
  - greedy
  - balanced
  seeds:
  - 0
  - 1
  - 2
  max_new_tokens: 200
